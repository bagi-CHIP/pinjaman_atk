<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin - Kelola ATK & Permintaan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" style="max-width: 1000px;">
        <h2>Panel Admin - Kelola ATK & Permintaan</h2>

        <!-- BAGIAN 1: KELOLA STOK BARANG -->
        <div class="card" style="margin-bottom: 30px; padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
            <h3>Kelola Stok Barang</h3>
            <form id="formBarang" style="display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;">
                <input type="text" id="kodeBarang" placeholder="Kode (misal: BRG-004)" style="flex: 1;">
                <input type="text" id="namaBarang" placeholder="Nama Barang" required style="flex: 2;">
                <input type="text" id="satuanBarang" placeholder="Satuan (pcs/unit)" style="flex: 1;">
                <input type="number" id="stokBarang" placeholder="Stok" required min="0" style="flex: 1;">
                <button type="submit" class="btn-primary">+ Tambah Barang</button>
            </form>

            <table class="table" width="100%">
                <thead>
                    <tr>
                        <th>Kode</th>
                        <th>Nama Barang</th>
                        <th>Satuan</th>
                        <th>Stok</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="bodyBarang">
                    <tr><td colspan="5" style="text-align: center;">Memuat data barang...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- BAGIAN 2: DAFTAR PERMINTAAN MASUK -->
        <div class="card" style="padding: 20px; border: 1px solid #ccc; border-radius: 8px;">
            <h3>Daftar Permintaan ATK Masuk</h3>
            <table class="table" width="100%">
                <thead>
                    <tr>
                        <th>Tanggal</th>
                        <th>Nama & Divisi</th>
                        <th>Keperluan</th>
                        <th>Item yang Diminta</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="bodyPermintaan">
                    <tr><td colspan="6" style="text-align: center;">Memuat daftar permintaan...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- 1. LOGIKA KELOLA BARANG ---
        async function muatStokBarang() {
            try {
                const res = await fetch('/api/barang');
                const data = await res.json();
                const body = document.getElementById('bodyBarang');

                if (data.length === 0) {
                    body.innerHTML = '<tr><td colspan="5" style="text-align: center;">Belum ada barang di database</td></tr>';
                    return;
                }

                body.innerHTML = '';
                data.forEach(item => {
                    body.innerHTML += `
                        <tr>
                            <td>${item.kode || '-'}</td>
                            <td><strong>${item.nama}</strong></td>
                            <td>${item.satuan || 'pcs'}</td>
                            <td>
                                <input type="number" value="${item.stok}" min="0" id="stok-${item.id}" style="width: 60px;">
                                <button onclick="updateStok(${item.id})" style="background: #28a745; color: white; border: none; padding: 2px 6px; cursor: pointer;">Simpan</button>
                            </td>
                            <td>
                                <button onclick="hapusBarang(${item.id})" style="background: #dc3545; color: white; border: none; padding: 4px 8px; cursor: pointer;">Hapus</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Gagal memuat barang:', err);
                document.getElementById('bodyBarang').innerHTML = '<tr><td colspan="5" style="text-align: center; color: red;">Gagal mengambil data barang</td></tr>';
            }
        }

        // Tambah Barang Baru
        document.getElementById('formBarang').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                kode: document.getElementById('kodeBarang').value,
                nama: document.getElementById('namaBarang').value,
                satuan: document.getElementById('satuanBarang').value || 'pcs',
                stok: parseInt(document.getElementById('stokBarang').value)
            };

            const res = await fetch('/api/barang', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                document.getElementById('formBarang').reset();
                muatStokBarang();
            } else {
                alert('Gagal menambah barang');
            }
        });

        // Update Stok
        async function updateStok(id) {
            const stokBaru = parseInt(document.getElementById(`stok-${id}`).value);
            const res = await fetch(`/api/barang/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ stok: stokBaru })
            });

            if (res.ok) {
                alert('Stok berhasil diperbarui!');
                muatStokBarang();
            } else {
                alert('Gagal memperbarui stok');
            }
        }

        // Hapus Barang
        async function hapusBarang(id) {
            if (!confirm('Yakin ingin menghapus barang ini?')) return;
            const res = await fetch(`/api/barang/${id}`, { method: 'DELETE' });
            if (res.ok) {
                muatStokBarang();
            } else {
                alert('Gagal menghapus barang');
            }
        }


        // --- 2. LOGIKA KELOLA PERMINTAAN ---
        async function muatPermintaan() {
            try {
                const res = await fetch('/api/peminjaman');
                const data = await res.json();
                const body = document.getElementById('bodyPermintaan');

                if (data.length === 0) {
                    body.innerHTML = '<tr><td colspan="6" style="text-align: center;">Belum ada permintaan masuk</td></tr>';
                    return;
                }

                body.innerHTML = '';
                data.forEach(p => {
                    let itemsHtml = '-';
                    try {
                        const parsedItems = JSON.parse(p.items);
                        if (Array.isArray(parsedItems)) {
                            itemsHtml = parsedItems.map(i => `• ${i.nama_barang} (${i.jumlah})`).join('<br>');
                        }
                    } catch (e) {
                        itemsHtml = p.items;
                    }

                    const badgeColor = p.status === 'Disetujui' ? 'green' : (p.status === 'Ditolak' ? 'red' : 'orange');

                    body.innerHTML += `
                        <tr>
                            <td><small>${p.tanggal ? new Date(p.tanggal).toLocaleDateString('id-ID') : '-'}</small></td>
                            <td><strong>${p.nama_peminjam}</strong><br><small>(${p.divisi})</small></td>
                            <td>${p.keperluan || '-'}</td>
                            <td>${itemsHtml}</td>
                            <td><b style="color: ${badgeColor};">${p.status || 'Pending'}</b></td>
                            <td>
                                <button onclick="ubahStatus(${p.id}, 'Disetujui')" style="background: #28a745; color: white; border: none; padding: 4px 6px; cursor: pointer; margin-bottom: 2px;">Setujui</button>
                                <button onclick="ubahStatus(${p.id}, 'Ditolak')" style="background: #dc3545; color: white; border: none; padding: 4px 6px; cursor: pointer;">Tolak</button>
                            </td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error('Gagal memuat permintaan:', err);
                document.getElementById('bodyPermintaan').innerHTML = '<tr><td colspan="6" style="text-align: center; color: red;">Gagal mengambil data permintaan</td></tr>';
            }
        }

        // Ubah Status Permintaan
        async function ubahStatus(id, status) {
            const res = await fetch(`/api/peminjaman/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: status })
            });

            if (res.ok) {
                muatPermintaan();
            } else {
                alert('Gagal mengubah status');
            }
        }

        // Muat semua data saat halaman dibuka
        document.addEventListener('DOMContentLoaded', () => {
            muatStokBarang();
            muatPermintaan();
        });
    </script>
</body>
</html>
