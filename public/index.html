<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Permintaan ATK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Formulir Permintaan ATK</h2>

        <form id="formPermintaan">
            <div class="form-group">
                <label>Nama Peminta:</label>
                <input type="text" id="nama" required placeholder="Masukkan nama Anda">
            </div>

            <div class="form-group">
                <label>Divisi / Bidang:</label>
                <input type="text" id="divisi" required placeholder="Contoh: Keuangan, IT, Umum">
            </div>

            <div class="form-group">
                <label>Keperluan:</label>
                <textarea id="keperluan" rows="2" placeholder="Alasan peminjaman/permintaan"></textarea>
            </div>

            <hr>

            <h3>Pilih Barang</h3>
            <div class="form-group">
                <label>Pilih Barang ATK:</label>
                <select id="selectBarang">
                    <option value="">-- Memuat Barang... --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Jumlah:</label>
                <input type="number" id="jumlahBarang" min="1" value="1">
            </div>

            <button type="button" class="btn-secondary" onclick="tambahItem()">+ Tambah ke Daftar List</button>

            <h3>Daftar Item yang Diminta</h3>
            <table class="table" id="tabelItem">
                <thead>
                    <tr>
                        <th>Barang</th>
                        <th>Jumlah</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="bodyItem">
                    <tr>
                        <td colspan="3" style="text-align: center; color: #888;">Belum ada item ditambahkan</td>
                    </tr>
                </tbody>
            </table>

            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 20px;">Kirim Permintaan</button>
        </form>
    </div>

    <script>
        let itemsDipilih = [];
        let dataBarangLokal = [];

        // Fungsi mengambil data barang terbaru dari server API
        async function muatBarang() {
            try {
                const response = await fetch('/api/barang');
                if (!response.ok) throw new Error('Gagal memuat barang');
                
                dataBarangLokal = await response.json();
                const select = document.getElementById('selectBarang');
                select.innerHTML = '<option value="">-- Pilih Barang --</option>';

                dataBarangLokal.forEach(barang => {
                    if (barang.stok > 0) {
                        const option = document.createElement('option');
                        option.value = barang.id;
                        option.textContent = `${barang.nama} (Stok: ${barang.stok} ${barang.satuan || 'pcs'})`;
                        select.appendChild(option);
                    }
                });
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('selectBarang').innerHTML = '<option value="">Gagal memuat data barang</option>';
            }
        }

        // Fungsi tambah item ke tabel sementara
        function tambahItem() {
            const select = document.getElementById('selectBarang');
            const barangId = select.value;
            const jumlah = parseInt(document.getElementById('jumlahBarang').value);

            if (!barangId) {
                alert('Silakan pilih barang terlebih dahulu!');
                return;
            }

            const barang = dataBarangLokal.find(b => b.id == barangId);
            if (!barang) return;

            if (jumlah > barang.stok) {
                alert(`Jumlah melebihi stok yang tersedia (${barang.stok} ${barang.satuan})`);
                return;
            }

            // Cek apakah barang sudah ada di list
            const ada = itemsDipilih.find(i => i.barang_id == barangId);
            if (ada) {
                ada.jumlah += jumlah;
            } else {
                itemsDipilih.push({
                    barang_id: barang.id,
                    nama_barang: barang.nama,
                    jumlah: jumlah
                });
            }

            renderTabelItem();
        }

        // Render tabel item sementara
        function renderTabelItem() {
            const body = document.getElementById('bodyItem');
            if (itemsDipilih.length === 0) {
                body.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #888;">Belum ada item ditambahkan</td></tr>';
                return;
            }

            body.innerHTML = '';
            itemsDipilih.forEach((item, index) => {
                body.innerHTML += `
                    <tr>
                        <td>${item.nama_barang}</td>
                        <td>${item.jumlah}</td>
                        <td><button type="button" onclick="hapusItem(${index})" style="background:red; color:white; border:none; padding:4px 8px; cursor:pointer;">Hapus</button></td>
                    </tr>
                `;
            });
        }

        function hapusItem(index) {
            itemsDipilih.splice(index, 1);
            renderTabelItem();
        }

        // Submit Form Permintaan
        document.getElementById('formPermintaan').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (itemsDipilih.length === 0) {
                alert('Harap tambahkan minimal 1 barang ke dalam daftar!');
                return;
            }

            const payload = {
                nama_peminjam: document.getElementById('nama').value,
                divisi: document.getElementById('divisi').value,
                keperluan: document.getElementById('keperluan').value,
                items: JSON.stringify(itemsDipilih)
            };

            try {
                const response = await fetch('/api/peminjaman', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('Permintaan berhasil dikirim!');
                    itemsDipilih = [];
                    document.getElementById('formPermintaan').reset();
                    renderTabelItem();
                    muatBarang(); // Refresh stok
                } else {
                    alert('Gagal mengirim permintaan.');
                }
            } catch (error) {
                console.error('Error submit:', error);
                alert('Terjadi kesalahan saat mengubungi server.');
            }
        });

        // Jalankan otomatis saat halaman selesai dimuat
        document.addEventListener('DOMContentLoaded', muatBarang);
    </script>
</body>
</html>
